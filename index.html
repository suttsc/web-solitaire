<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14532d" />
    <meta name="description" content="Klondike solitaire. No ads, works offline." />
    <title>Solitaire</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
  </head>
  <body class="h-dvh overflow-hidden bg-felt text-white antialiased select-none">
    <div
      class="mx-auto flex h-full max-w-5xl flex-col pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)]"
    >
      <header class="grid grid-cols-3 px-4 py-2 text-center" aria-label="Game status">
        <div>
          <div class="text-[0.65rem] tracking-widest text-white/60 uppercase">Score</div>
          <div class="text-lg font-semibold tabular-nums" data-hud="score">0</div>
        </div>
        <div>
          <div class="text-[0.65rem] tracking-widest text-white/60 uppercase">Time</div>
          <div class="text-lg font-semibold tabular-nums" data-hud="time">0:00</div>
        </div>
        <div>
          <div class="text-[0.65rem] tracking-widest text-white/60 uppercase">Moves</div>
          <div class="text-lg font-semibold tabular-nums" data-hud="moves">0</div>
        </div>
      </header>

      <main class="relative flex-1">
        <div id="board" class="absolute inset-0 touch-none" aria-label="Card table"></div>
        <button
          id="autocomplete"
          type="button"
          hidden
          class="absolute bottom-3 left-1/2 z-[2500] -translate-x-1/2 rounded-full bg-amber-400 px-5 py-3 text-sm font-semibold text-stone-900 shadow-lg"
        >
          Auto-complete
        </button>
        <div
          id="dealing"
          hidden
          role="status"
          class="absolute inset-0 z-[3000] grid place-items-center bg-felt-dark/80 text-sm font-medium"
        >
          Finding a winnable deal…
        </div>
        <button
          id="pause-overlay"
          type="button"
          hidden
          class="absolute inset-0 z-[3000] grid place-items-center bg-felt-dark/95 text-center"
        >
          <span class="space-y-2">
            <span class="block text-2xl font-semibold">Paused</span>
            <span class="block text-sm text-white/70">Tap to resume</span>
          </span>
        </button>
      </main>

      <nav class="grid grid-cols-5 gap-1 px-2 pt-1 pb-2" aria-label="Game controls">
        <button type="button" data-action="new" class="toolbar-button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          New game
        </button>
        <button type="button" data-action="undo" class="toolbar-button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 14 4 9l5-5" />
            <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
          </svg>
          Undo
        </button>
        <button type="button" data-action="stats" class="toolbar-button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
          </svg>
          Stats
        </button>
        <button type="button" data-action="leaderboard" class="toolbar-button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z" />
            <path d="M17 6h3v2a3 3 0 0 1-3 3M7 6H4v2a3 3 0 0 0 3 3" />
          </svg>
          Leaders
        </button>
        <button type="button" data-action="settings" class="toolbar-button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"
            />
          </svg>
          Settings
        </button>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
